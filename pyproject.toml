[project]
name = "voi-diffusion-ipp"
version = "0.1.0"
description = "Sequential value-of-information planning with model-based diffusion and sampled RPCBF"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["jax==0.4.38", "numpy>=1.26,<3", "scipy>=1.12,<1.17", "matplotlib>=3.8,<4", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9", "pypdf>=5", "pypdfium2>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
