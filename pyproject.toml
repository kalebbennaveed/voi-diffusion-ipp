[project]
name = "voi-diffusion-ipp"
version = "0.1.0"
description = "Disturbance-aware informative planning in spatiotemporal environments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["jax==0.4.38", "numpy>=2,<3", "scipy>=1.12,<1.17", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
